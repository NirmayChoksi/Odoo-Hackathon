<div class="bg-white dark:bg-slate-900 rounded-3xl p-8 shadow-xl shadow-slate-200/50 dark:shadow-none border border-slate-200 dark:border-slate-800 hover:border-indigo-500/30 dark:hover:border-indigo-500/30 transition-all duration-300 group">
  <div class="flex justify-between items-start mb-10">
    <h2 class="text-2xl font-bold text-indigo-600 dark:text-indigo-400">{{ data.title }}</h2>
    <div class="p-2 bg-slate-50 dark:bg-slate-800 rounded-xl group-hover:bg-indigo-50 dark:group-hover:bg-indigo-900/20 transition-colors">
      <svg class="w-6 h-6 text-slate-400 group-hover:text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path>
      </svg>
    </div>
  </div>

  <div class="flex flex-col sm:flex-row items-center sm:items-end justify-between gap-6">
    <button class="bg-white dark:bg-slate-950 border-2 border-indigo-600 dark:border-indigo-500 text-indigo-600 dark:text-indigo-400 font-bold px-8 py-2.5 rounded-xl hover:bg-indigo-600 hover:text-white transition-all transform active:scale-95 shadow-lg shadow-indigo-600/10 whitespace-nowrap">
      {{ data.mainAction }}
    </button>

    <div class="space-y-2 text-right">
      <div *ngFor="let item of data.stats" class="flex items-center justify-end gap-2">
        <span class="text-2xl font-bold font-mono" [ngClass]="item.color">{{ item.value }}</span>
        <span class="text-sm font-medium text-slate-500 dark:text-slate-400">{{ item.label }}</span>
      </div>
    </div>
  </div>
</div>
