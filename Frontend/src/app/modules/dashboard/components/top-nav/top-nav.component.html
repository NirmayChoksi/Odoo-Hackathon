<nav class="bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 transition-colors duration-300">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex justify-between h-16">
      <div class="flex">
        <!-- Logo -->
        <div class="flex-shrink-0 flex items-center">
          <div class="bg-indigo-600 p-1.5 rounded-lg text-white mr-2">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
            </svg>
          </div>
          <span class="text-slate-900 dark:text-white font-bold tracking-tight">StockFlow</span>
        </div>

        <!-- Desktop Links -->
        <div class="hidden sm:ml-8 sm:flex sm:space-x-8">
          <a routerLink="/dashboard" routerLinkActive="border-indigo-500 text-slate-900 dark:text-white" [routerLinkActiveOptions]="{exact: true}" 
             class="border-transparent text-slate-500 dark:text-slate-400 hover:border-slate-300 dark:hover:border-slate-600 hover:text-slate-700 dark:hover:text-slate-200 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium transition-colors">
            Dashboard
          </a>

          <!-- Operations Dropdown -->
          <div class="relative inline-flex items-center group">
            <button (mouseenter)="isOperationsOpen.set(true)" 
                    class="border-transparent text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-slate-200 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium transition-colors h-full">
              Operations
              <svg class="ml-1 w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
            </button>
            
            <div *ngIf="isOperationsOpen()" (mouseleave)="isOperationsOpen.set(false)"
                 class="absolute top-full left-0 w-48 bg-white dark:bg-slate-800 rounded-xl shadow-xl ring-1 ring-slate-200 dark:ring-slate-700 py-2 z-50 transform origin-top transition-all">
              <a routerLink="/operations/receipt" class="block px-4 py-2 text-sm text-slate-700 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 hover:text-indigo-600 transition-colors">Receipt</a>
              <a routerLink="/operations/delivery" class="block px-4 py-2 text-sm text-slate-700 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 hover:text-indigo-600 transition-colors">Delivery</a>
              <a routerLink="/operations/adjustment" class="block px-4 py-2 text-sm text-slate-700 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 hover:text-indigo-600 transition-colors">Adjustment</a>
            </div>
          </div>

          <a routerLink="/stock" routerLinkActive="border-indigo-500 text-slate-900 dark:text-white"
             class="border-transparent text-slate-500 dark:text-slate-400 hover:border-slate-300 dark:hover:border-slate-600 hover:text-slate-700 dark:hover:text-slate-200 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium transition-colors">
            Stock
          </a>
          <a routerLink="/dashboard/move-history" routerLinkActive="border-indigo-500 text-slate-900 dark:text-white"
             class="border-transparent text-slate-500 dark:text-slate-400 hover:border-slate-300 dark:hover:border-slate-600 hover:text-slate-700 dark:hover:text-slate-200 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium transition-colors">
            Move History
          </a>
          <a routerLink="/dashboard/settings" routerLinkActive="border-indigo-500 text-slate-900 dark:text-white"
             class="border-transparent text-slate-500 dark:text-slate-400 hover:border-slate-300 dark:hover:border-slate-600 hover:text-slate-700 dark:hover:text-slate-200 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium transition-colors">
            Settings
          </a>
        </div>
      </div>

      <!-- Right Side: Theme Toggle + Profile -->
      <div class="hidden sm:ml-6 sm:flex sm:items-center gap-3">

        <!-- Theme Toggle -->
        <button (click)="theme.toggle()"
          class="relative h-9 w-9 flex items-center justify-center rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-500 dark:text-yellow-400 border border-slate-200 dark:border-slate-700 hover:bg-slate-200 dark:hover:bg-slate-700 hover:scale-105 active:scale-95 transition-all duration-200 focus:outline-none"
          [attr.aria-label]="theme.isDarkMode() ? 'Switch to light mode' : 'Switch to dark mode'">
          <!-- Sun (dark mode active) -->
          <svg *ngIf="theme.isDarkMode()" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707M16.95 17.657l.707.707M7.05 7.05l.707-.707M12 8a4 4 0 100 8 4 4 0 000-8z"/>
          </svg>
          <!-- Moon (light mode active) -->
          <svg *ngIf="!theme.isDarkMode()" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>
          </svg>
        </button>

        <!-- Divider -->
        <span class="w-px h-6 bg-slate-200 dark:bg-slate-700"></span>

        <!-- User Profile -->
        <div class="flex items-center gap-2 text-slate-700 dark:text-slate-300">
          <div class="w-8 h-8 rounded-full bg-indigo-100 dark:bg-indigo-900/40 flex items-center justify-center border border-indigo-200 dark:border-indigo-700">
            <span class="text-xs font-bold text-indigo-600 dark:text-indigo-400">JD</span>
          </div>
          <span class="text-sm font-medium">John Doe</span>
        </div>
      </div>

      <!-- Mobile Menu Toggle -->
      <div class="-mr-2 flex items-center sm:hidden">
        <button (click)="toggleMobileMenu()" class="inline-flex items-center justify-center p-2 rounded-md text-slate-400 hover:text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800 focus:outline-none transition-colors">
          <svg [class.hidden]="isMobileMenuOpen()" class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
          <svg [class.hidden]="!isMobileMenuOpen()" class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
      </div>
    </div>
  </div>

  <!-- Mobile Menu -->
  <div *ngIf="isMobileMenuOpen()" class="sm:hidden bg-white dark:bg-slate-900 border-t border-slate-200 dark:border-slate-800 divide-y divide-slate-100 dark:divide-slate-800">
    <div class="pt-2 pb-3 space-y-1">
      <a routerLink="/dashboard" class="block pl-3 pr-4 py-2 border-l-4 border-indigo-500 text-base font-medium text-indigo-700 dark:text-indigo-400 bg-indigo-50 dark:bg-indigo-900/10">Dashboard</a>
      <a routerLink="/operations/receipt" class="block pl-3 pr-4 py-2 border-l-4 border-transparent text-base font-medium text-slate-600 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-800 hover:text-indigo-600">Receipts</a>
      <a routerLink="/stock" class="block pl-3 pr-4 py-2 border-l-4 border-transparent text-base font-medium text-slate-600 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-800 hover:text-indigo-600">Stock</a>
    </div>
  </div>
</nav>
