<nav
  class="bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 transition-colors duration-300"
>
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex justify-between h-16">
      <div class="flex">
        <!-- Logo -->
        <div class="flex-shrink-0 flex items-center">
          <div class="bg-indigo-600 p-1.5 rounded-lg text-white mr-2">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M13 10V3L4 14h7v7l9-11h-7z"
              ></path>
            </svg>
          </div>
          <span class="text-slate-900 dark:text-white font-bold tracking-tight">StockFlow</span>
        </div>

        <!-- Desktop Links -->
        <div class="hidden sm:ml-8 sm:flex sm:space-x-8">
          <a
            routerLink="/dashboard"
            routerLinkActive="border-indigo-500 text-slate-900 dark:text-white"
            [routerLinkActiveOptions]="{ exact: true }"
            class="border-transparent text-slate-500 dark:text-slate-400 hover:border-slate-300 dark:hover:border-slate-600 hover:text-slate-700 dark:hover:text-slate-200 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium transition-colors"
          >
            Dashboard
          </a>

          <!-- Operations Dropdown -->
          <div class="relative inline-flex items-center group" (mouseleave)="isOperationsOpen.set(false)">
            <button (mouseenter)="isOperationsOpen.set(true)"
              class="border-transparent text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-slate-200 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium transition-colors h-full">
              Operations
              <svg class="ml-1 w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M19 9l-7 7-7-7"
                ></path>
              </svg>
            </button>

            <div *ngIf="isOperationsOpen()"
              class="absolute top-full left-0 w-48 bg-white dark:bg-slate-800 rounded-xl shadow-xl ring-1 ring-slate-200 dark:ring-slate-700 py-2 z-50 transform origin-top transition-all">
              <a routerLink="/operations/receipt"
                class="block px-4 py-2 text-sm text-slate-700 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 hover:text-indigo-600 transition-colors">Receipts</a>
              <a routerLink="/operations/delivery"
                class="block px-4 py-2 text-sm text-slate-700 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 hover:text-indigo-600 transition-colors">Delivery</a>
              <div class="block px-4 py-2 text-sm text-slate-400 dark:text-slate-600 cursor-not-allowed italic">
                Adjustment (Coming Soon)</div>
            </div>
          </div>

          <a
            routerLink="/dashboard/stock"
            routerLinkActive="border-indigo-500 text-slate-900 dark:text-white"
            class="border-transparent text-slate-500 dark:text-slate-400 hover:border-slate-300 dark:hover:border-slate-600 hover:text-slate-700 dark:hover:text-slate-200 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium transition-colors"
          >
            Stock
          </a>
          <a
            routerLink="/dashboard/move-history"
            routerLinkActive="border-indigo-500 text-slate-900 dark:text-white"
            class="border-transparent text-slate-500 dark:text-slate-400 hover:border-slate-300 dark:hover:border-slate-600 hover:text-slate-700 dark:hover:text-slate-200 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium transition-colors"
          >
            Move History
          </a>
          <a
            routerLink="/dashboard/contacts"
            routerLinkActive="border-indigo-500 text-slate-900 dark:text-white"
            class="border-transparent text-slate-500 dark:text-slate-400 hover:border-slate-300 dark:hover:border-slate-600 hover:text-slate-700 dark:hover:text-slate-200 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium transition-colors"
          >
            Contacts
          </a>
          <a
            routerLink="/dashboard/settings"
            routerLinkActive="border-indigo-500 text-slate-900 dark:text-white"
            class="border-transparent text-slate-500 dark:text-slate-400 hover:border-slate-300 dark:hover:border-slate-600 hover:text-slate-700 dark:hover:text-slate-200 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium transition-colors"
          >
            Settings
          </a>
        </div>
      </div>

      <!-- Right Side: Theme Toggle + Profile -->
      <div class="hidden sm:ml-6 sm:flex sm:items-center gap-3">
        <!-- Theme Toggle -->
        <button
          (click)="theme.toggle()"
          class="relative h-9 w-9 flex items-center justify-center rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-500 dark:text-yellow-400 border border-slate-200 dark:border-slate-700 hover:bg-slate-200 dark:hover:bg-slate-700 hover:scale-105 active:scale-95 transition-all duration-200 focus:outline-none"
          [attr.aria-label]="theme.isDarkMode() ? 'Switch to light mode' : 'Switch to dark mode'"
        >
          <!-- Sun (dark mode active) -->
          <svg
            *ngIf="theme.isDarkMode()"
            class="w-4 h-4"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="2"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707M16.95 17.657l.707.707M7.05 7.05l.707-.707M12 8a4 4 0 100 8 4 4 0 000-8z"
            />
          </svg>
          <!-- Moon (light mode active) -->
          <svg
            *ngIf="!theme.isDarkMode()"
            class="w-4 h-4"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="2"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"
            />
          </svg>
        </button>

        <!-- Divider -->
        <span class="w-px h-6 bg-slate-200 dark:bg-slate-700"></span>

        <!-- User Profile -->
        <div class="relative flex items-center gap-2 group">
          <button
            (click)="toggleProfile()"
            class="flex items-center gap-2 px-2 py-1.5 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-800 transition-all active:scale-95 group"
          >
            <div
              class="w-8 h-8 rounded-full bg-indigo-100 dark:bg-indigo-900/40 flex items-center justify-center border border-indigo-200 dark:border-indigo-700"
            >
              <span class="text-xs font-bold text-indigo-600 dark:text-indigo-400">{{
                initials
              }}</span>
            </div>
            <div class="flex flex-col items-start min-w-[80px]">
              <span class="text-sm font-bold text-slate-700 dark:text-slate-200">
                {{ currentUser?.loginId ?? 'User' }}
              </span>
              <span class="text-[10px] text-slate-400 uppercase tracking-widest font-bold -mt-0.5">
                {{ currentUser?.role ?? 'Guest' }}
              </span>
            </div>
            <svg
              class="w-4 h-4 text-slate-400 transition-transform duration-200"
              [ngClass]="isProfileOpen() ? 'rotate-180' : ''"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M19 9l-7 7-7-7"
              />
            </svg>
          </button>

          <!-- Profile Dropdown -->
          @if (isProfileOpen()) {
            <div
              (mouseleave)="isProfileOpen.set(false)"
              class="absolute top-full right-0 mt-2 w-64 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl shadow-2xl z-50 overflow-hidden py-1.5"
            >
              <!-- User info header inside dropdown -->
              <div class="px-4 py-3 border-b border-slate-100 dark:border-slate-800">
                <p class="text-sm font-bold text-slate-800 dark:text-white">
                  {{ currentUser?.loginId ?? 'User' }}
                </p>
                <p class="text-xs text-slate-400 truncate mt-0.5">{{ currentUser?.email ?? '' }}</p>
                <span
                  class="inline-block mt-1.5 px-2 py-0.5 rounded-full text-[10px] font-bold uppercase tracking-wider bg-indigo-100 dark:bg-indigo-900/40 text-indigo-600 dark:text-indigo-400"
                >
                  {{ currentUser?.role ?? 'guest' }}
                </span>
              </div>

              <!-- <a href="#"
              class="flex items-center gap-3 px-4 py-2.5 text-sm font-semibold text-slate-600 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-800 hover:text-indigo-600 transition-all group">
              <svg class="w-4 h-4 opacity-70" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round"
                  d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
              </svg>
              My Profile
            </a>
            <a href="#"
              class="flex items-center gap-3 px-4 py-2.5 text-sm font-semibold text-slate-600 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-800 hover:text-indigo-600 transition-all group border-b border-slate-100 dark:border-slate-800/50">
              <svg class="w-4 h-4 opacity-70" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round"
                  d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.1.959.826 2.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
              </svg>
              Account Settings
            </a> -->
              <button
                (click)="logout()"
                class="w-full flex items-center gap-3 px-4 py-2.5 text-sm font-bold text-rose-500 hover:bg-rose-50 dark:hover:bg-rose-900/20 transition-all group text-left"
              >
                <svg
                  class="w-4 h-4 transition-transform group-hover:translate-x-1"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"
                  />
                </svg>
                Log Out
              </button>
            </div>
          }
        </div>
      </div>

      <!-- Mobile Menu Toggle -->
      <div class="-mr-2 flex items-center sm:hidden">
        <button
          (click)="toggleMobileMenu()"
          class="inline-flex items-center justify-center p-2 rounded-md text-slate-400 hover:text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800 focus:outline-none transition-colors"
        >
          <svg
            [class.hidden]="isMobileMenuOpen()"
            class="h-6 w-6"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M4 6h16M4 12h16M4 18h16"
            ></path>
          </svg>
          <svg
            [class.hidden]="!isMobileMenuOpen()"
            class="h-6 w-6"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M6 18L18 6M6 6l12 12"
            ></path>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <!-- Mobile Menu -->
  <div
    *ngIf="isMobileMenuOpen()"
    class="sm:hidden bg-white dark:bg-slate-900 border-t border-slate-200 dark:border-slate-800 divide-y divide-slate-100 dark:divide-slate-800"
  >
    <div class="pt-2 pb-3 space-y-1">
      <a
        routerLink="/dashboard"
        class="block pl-3 pr-4 py-2 border-l-4 border-indigo-500 text-base font-medium text-indigo-700 dark:text-indigo-400 bg-indigo-50 dark:bg-indigo-900/10"
        >Dashboard</a
      >
      <a
        routerLink="/operations/receipt"
        class="block pl-3 pr-4 py-2 border-l-4 border-transparent text-base font-medium text-slate-600 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-800 hover:text-indigo-600"
        >Receipts</a
      >
      <a
        routerLink="/dashboard/stock"
        class="block pl-3 pr-4 py-2 border-l-4 border-transparent text-base font-medium text-slate-600 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-800 hover:text-indigo-600"
        >Stock</a
      >
    </div>
  </div>
</nav>
