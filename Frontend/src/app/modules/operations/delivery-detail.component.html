<div class="bg-white dark:bg-slate-800 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700 overflow-hidden">

  <!-- Header Bar -->
  <div class="p-4 border-b border-slate-200 dark:border-slate-700 flex flex-col lg:flex-row justify-between items-start lg:items-center gap-4">
    <div class="flex items-center gap-4">
      <a routerLink="/operations/delivery/new" class="btn-primary bg-white dark:bg-slate-900 !text-indigo-600 dark:!text-indigo-400 border border-indigo-200 dark:border-indigo-500/30 hover:bg-indigo-50 dark:hover:bg-indigo-900/30" style="width: auto; padding: 0.5rem 1rem;">
        New
      </a>
      <h2 class="text-xl font-bold text-slate-800 dark:text-white">Delivery</h2>
    </div>

    <!-- Actions & Status Pipeline -->
    <div class="flex flex-col sm:flex-row items-start sm:items-center gap-6 w-full lg:w-auto">

      <!-- Action Buttons -->
      <div class="flex items-center gap-2 flex-wrap">
        <!-- Save button — shown only for new unsaved deliveries -->
        <button *ngIf="isNew()" (click)="save()" class="btn-primary" style="width: auto; padding: 0.5rem 1.25rem; background: linear-gradient(135deg, #10b981, #059669);">
          <svg class="w-4 h-4 inline mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
          Save
        </button>

        <!-- Out of stock warning -->
        <div *ngIf="hasOutOfStockItems() && !isNew()" class="flex items-center gap-1.5 px-3 py-1.5 bg-red-50 dark:bg-red-900/30 border border-red-200 dark:border-red-800 rounded-lg text-red-600 dark:text-red-400 text-xs font-semibold">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"></path></svg>
          Out of Stock
        </div>

        <button *ngIf="status() === 'Draft' && !isNew()" (click)="markAsWaiting()" class="btn-primary" style="width: auto; padding: 0.5rem 1rem;">
          Mark as Waiting
        </button>
        <button *ngIf="status() === 'Waiting'" (click)="markAsReady()" class="btn-primary" style="width: auto; padding: 0.5rem 1rem;">
          Mark as Ready
        </button>
        <button *ngIf="status() === 'Ready'" (click)="validate()" class="btn-primary" style="width: auto; padding: 0.5rem 1rem;">
          Validate
        </button>
        <button *ngIf="status() === 'Done'" (click)="printDelivery()" class="px-4 py-2 rounded-lg font-semibold text-sm bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-200 hover:bg-slate-200 dark:hover:bg-slate-600 transition-colors">
          Print
        </button>
        <button (click)="cancel()" class="px-4 py-2 rounded-lg font-semibold text-sm bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-600 text-slate-600 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-700 transition-colors">
          Cancel
        </button>
      </div>

      <!-- Chevron Status Pipeline: Draft > Waiting > Ready > Done -->
      <div class="flex items-center text-sm font-semibold overflow-hidden rounded-full border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 relative shrink-0">

        <div class="px-4 py-1.5 relative z-10 transition-colors"
             [ngClass]="{'bg-indigo-600 text-white': status() === 'Draft', 'text-slate-500 dark:text-slate-400': status() !== 'Draft'}">
          Draft
          <div *ngIf="status() === 'Draft'" class="absolute right-[-8px] top-0 bottom-0 w-4 bg-indigo-600" style="clip-path: polygon(0 0, 100% 50%, 0 100%); z-index: 2;"></div>
        </div>

        <div class="px-4 py-1.5 pl-6 relative z-10 transition-colors"
             [ngClass]="{'bg-amber-500 text-white': status() === 'Waiting', 'text-slate-500 dark:text-slate-400': status() !== 'Waiting'}">
          Waiting
          <div *ngIf="status() === 'Waiting'" class="absolute right-[-8px] top-0 bottom-0 w-4 bg-amber-500" style="clip-path: polygon(0 0, 100% 50%, 0 100%); z-index: 2;"></div>
        </div>

        <div class="px-4 py-1.5 pl-6 relative z-10 transition-colors"
             [ngClass]="{'bg-indigo-600 text-white': status() === 'Ready', 'text-slate-500 dark:text-slate-400': status() !== 'Ready'}">
          Ready
          <div *ngIf="status() === 'Ready'" class="absolute right-[-8px] top-0 bottom-0 w-4 bg-indigo-600" style="clip-path: polygon(0 0, 100% 50%, 0 100%); z-index: 2;"></div>
        </div>

        <div class="px-4 py-1.5 pl-6 relative z-10 transition-colors"
             [ngClass]="{'bg-emerald-600 text-white': status() === 'Done', 'text-slate-500 dark:text-slate-400': status() !== 'Done'}">
          Done
        </div>
      </div>

    </div>
  </div>

  <!-- Body Content -->
  <div class="p-6 lg:p-10">
    <h1 class="text-3xl font-bold text-slate-900 dark:text-white mb-8">{{ reference() }}</h1>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-x-16 gap-y-6 mb-10">

      <!-- Left Column -->
      <div class="space-y-6">
        <div>
          <label class="block text-sm font-bold text-slate-700 dark:text-slate-300 mb-2">Delivery Address</label>
          <input type="text" [disabled]="status() === 'Done'" [ngModel]="deliveryAddress()" (ngModelChange)="deliveryAddress.set($event)" placeholder="Enter delivery address..." class="w-full bg-transparent border-0 border-b border-slate-300 dark:border-slate-600 focus:border-indigo-600 dark:focus:border-indigo-400 focus:ring-0 px-0 py-1 text-slate-900 dark:text-white font-medium disabled:text-slate-500 dark:disabled:text-slate-500 disabled:border-slate-200 dark:disabled:border-slate-700">
        </div>

        <div>
          <label class="block text-sm font-bold text-slate-700 dark:text-slate-300 mb-2">Responsible</label>
          <input type="text" disabled [ngModel]="responsible()" class="w-full bg-transparent border-0 border-b border-slate-200 dark:border-slate-700 px-0 py-1 text-slate-500 dark:text-slate-400 font-medium">
        </div>
      </div>

      <!-- Right Column -->
      <div class="space-y-6">
        <div>
          <label class="block text-sm font-bold text-slate-700 dark:text-slate-300 mb-2">Schedule Date</label>
          <input type="date" [disabled]="status() === 'Done'" [ngModel]="scheduleDate()" (ngModelChange)="scheduleDate.set($event)" class="w-full bg-transparent border-0 border-b border-slate-300 dark:border-slate-600 focus:border-indigo-600 dark:focus:border-indigo-400 focus:ring-0 px-0 py-1 text-slate-900 dark:text-white font-medium disabled:text-slate-500 dark:disabled:text-slate-500 disabled:border-slate-200 dark:disabled:border-slate-700 [color-scheme:light] dark:[color-scheme:dark]">
        </div>

        <div>
          <label class="block text-sm font-bold text-slate-700 dark:text-slate-300 mb-2">Operation Type</label>
          <select [disabled]="status() === 'Done'" [ngModel]="operationType()" (ngModelChange)="operationType.set($event)" class="w-full bg-transparent border-0 border-b border-slate-300 dark:border-slate-600 focus:border-indigo-600 dark:focus:border-indigo-400 focus:ring-0 px-0 py-1 text-slate-900 dark:text-white font-medium disabled:text-slate-500 dark:disabled:text-slate-500 [color-scheme:light] dark:[color-scheme:dark]">
            @for (type of operationTypes; track type) {
              <option [value]="type">{{ type }}</option>
            }
          </select>
        </div>
      </div>
    </div>

    <!-- Products Tab -->
    <div class="mt-8">
      <div class="border-b border-slate-200 dark:border-slate-700">
        <nav class="-mb-px flex space-x-8">
          <a href="#" class="border-indigo-500 text-indigo-600 dark:text-indigo-400 whitespace-nowrap py-4 px-1 border-b-2 font-semibold text-sm">
            Products
          </a>
        </nav>
      </div>

      <!-- Out of stock alert banner -->
      <div *ngIf="hasOutOfStockItems()" class="mt-4 flex items-center gap-3 px-4 py-3 bg-red-50 dark:bg-red-900/20 border border-red-200 dark:border-red-800 rounded-lg">
        <svg class="w-5 h-5 text-red-500 dark:text-red-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"></path></svg>
        <p class="text-sm font-semibold text-red-700 dark:text-red-400">Some products are not in stock. These rows are highlighted below.</p>
      </div>

      <!-- Products Table -->
      <div class="mt-4 overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="border-b-2 border-slate-200 dark:border-slate-700 text-slate-500 dark:text-slate-400 text-sm">
              <th class="py-3 font-semibold w-1/2">Product</th>
              <th class="py-3 font-semibold w-1/4">Quantity</th>
              <th class="py-3 font-semibold w-1/4 text-right">Actions</th>
            </tr>
          </thead>
          <tbody class="divide-y divide-slate-100 dark:divide-slate-700/50">
            @for (line of products(); track line.id) {
              <tr [ngClass]="{'bg-red-50 dark:bg-red-900/10': !line.inStock}">
                <td class="py-3 font-medium" [ngClass]="{'text-red-600 dark:text-red-400': !line.inStock, 'text-slate-800 dark:text-white': line.inStock}">
                  {{ line.product }}
                  <span *ngIf="!line.inStock" class="ml-2 text-xs bg-red-100 dark:bg-red-900/40 text-red-600 dark:text-red-400 px-1.5 py-0.5 rounded font-semibold">Out of stock</span>
                </td>
                <td class="py-3 text-slate-700 dark:text-slate-300 font-medium">
                  <input *ngIf="status() !== 'Done'" type="number" min="1" [ngModel]="line.quantity" (ngModelChange)="updateQuantity(line.id, $event)" class="w-16 bg-transparent border-0 border-b border-slate-300 dark:border-slate-600 focus:border-indigo-500 dark:focus:border-indigo-400 focus:outline-none focus:ring-0 px-0 py-1 text-center font-semibold text-slate-800 dark:text-white" style="-webkit-appearance:textfield; appearance:textfield;">
                  <span *ngIf="status() === 'Done'">{{ line.quantity }}</span>
                </td>
                <td class="py-3 text-right">
                  <button *ngIf="status() !== 'Done'" (click)="removeProduct(line.id)" class="p-1.5 text-slate-400 hover:text-red-500 hover:bg-red-50 dark:hover:bg-red-900/30 rounded-lg transition-colors">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                  </button>
                </td>
              </tr>
            }

            <!-- New Product Row -->
            <tr *ngIf="status() !== 'Done'">
              <td class="py-3">
                <div class="flex items-center gap-2 max-w-sm">
                  <input type="text" [ngModel]="newProductSearch()" (ngModelChange)="newProductSearch.set($event)" (keyup.enter)="addProduct()" placeholder="Search product to add..." class="w-full bg-transparent border-0 border-b border-slate-300 dark:border-slate-600 focus:border-indigo-600 dark:focus:border-indigo-400 focus:ring-0 px-0 py-1 text-sm dark:text-white dark:placeholder-slate-500">
                  <button (click)="addProduct()" class="text-indigo-600 dark:text-indigo-400 text-sm font-semibold hover:text-indigo-800 dark:hover:text-indigo-300 whitespace-nowrap">Add</button>
                </div>
              </td>
              <td class="py-3"></td>
              <td class="py-3"></td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

</div>
